version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ironclad_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ironclad_dev}
      POSTGRES_USER: ${POSTGRES_USER:-ironclad_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_secure_password_123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ironclad_admin} -d ${POSTGRES_DB:-ironclad_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: